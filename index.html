<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#10090c">
    <meta name="description" content="A heart formed from I love you, spoken in twenty languages.">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Cpath fill=%22%23e46579%22 d=%22M16 28 3.5 15.8A7.4 7.4 0 0 1 14 5.3l2 2 2-2a7.4 7.4 0 0 1 10.5 10.5Z%22/%3E%3C/svg%3E">
    <title>In Every Language — A Love Heart</title>
    <style>
      :root {
        color-scheme: dark;
        --ink: #10090c;
        --rose: #e46579;
        --soft-rose: #bc7b84;
        --quiet: #856a70;
        --serif: "Iowan Old Style", "Palatino Linotype", "Book Antiqua", Georgia, serif;
        --sans: "Avenir Next", Avenir, "Segoe UI", sans-serif;
      }
      * { box-sizing: border-box; }
      html, body { width: 100%; min-width: 280px; min-height: 100%; margin: 0; }
      body {
        min-height: 100svh;
        overflow: hidden;
        display: grid;
        place-items: center;
        color: #f1dce0;
        background:
          radial-gradient(ellipse at 50% 46%, rgba(94, 21, 40, .2), transparent 48%),
          radial-gradient(ellipse at 50% 100%, rgba(57, 14, 27, .14), transparent 45%),
          var(--ink);
        font-family: var(--sans);
        -webkit-font-smoothing: antialiased;
      }
      body::before {
        position: fixed;
        z-index: 0;
        inset: 0;
        pointer-events: none;
        content: "";
        opacity: .14;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.82' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.22'/%3E%3C/svg%3E");
      }
      .page {
        position: relative;
        z-index: 1;
        width: min(100%, 940px);
        min-height: 100svh;
        padding: max(34px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom));
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: space-between;
        text-align: center;
      }
      .intro { padding-top: 4px; animation: settle-in 1.2s both; }
      .eyebrow {
        margin: 0 0 15px;
        color: var(--soft-rose);
        font-size: 9px;
        font-weight: 600;
        letter-spacing: .34em;
        text-transform: uppercase;
      }
      h1 {
        margin: 0;
        color: #f1dce0;
        font-family: var(--serif);
        font-size: clamp(27px, 4vw, 43px);
        font-weight: 400;
        letter-spacing: -.035em;
        line-height: 1.08;
      }
      .subtitle {
        margin: 11px 0 0;
        color: #a88d93;
        font-family: var(--serif);
        font-size: clamp(13px, 1.8vw, 15px);
        font-style: italic;
        letter-spacing: .025em;
      }
      .art {
        width: min(100%, 720px);
        flex: 1;
        min-height: 0;
        display: grid;
        place-items: center;
        margin: 4px 0;
      }
      canvas {
        display: block;
        width: min(100%, 680px);
        height: min(68svh, 590px);
        overflow: visible;
      }
      .footer {
        width: min(100%, 680px);
        min-height: 42px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 18px;
        border-top: 1px solid rgba(208, 130, 145, .15);
        animation: settle-in 1.2s .15s both;
      }
      .caption {
        margin: 0;
        color: var(--quiet);
        font-size: 9px;
        font-weight: 500;
        letter-spacing: .14em;
        text-align: left;
        text-transform: uppercase;
      }
      .replay {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 9px;
        min-height: 36px;
        padding: 0 2px 0 12px;
        border: 0;
        color: #d9b4bb;
        background: transparent;
        font: 500 10px/1 var(--sans);
        letter-spacing: .16em;
        text-transform: uppercase;
        cursor: pointer;
        transition: color .2s ease;
      }
      .replay:hover { color: #fff0f2; }
      .replay:focus-visible { outline: 1px solid var(--rose); outline-offset: 4px; }
      .replay svg { width: 13px; height: 13px; transition: transform .35s ease; }
      .replay:hover svg { transform: rotate(-35deg); }
      @keyframes settle-in { from { opacity: 0; transform: translateY(7px); } to { opacity: 1; transform: translateY(0); } }
      @media (max-width: 600px) {
        .page { padding-right: 21px; padding-left: 21px; }
        .intro { padding-top: 13px; }
        .eyebrow { margin-bottom: 13px; font-size: 8px; }
        .art { width: min(100%, 510px); margin: 0; }
        canvas { width: 100%; height: min(63svh, 530px); }
        .footer { min-height: 48px; }
        .caption { max-width: 190px; font-size: 8px; line-height: 1.6; }
      }
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
      }
    </style>
  </head>
  <body>
    <main class="page">
      <header class="intro">
        <p class="eyebrow">For you, in every language</p>
        <h1>I love you.</h1>
        <p class="subtitle">Twenty ways to say it. One way to mean it.</p>
      </header>
      <div class="art">
        <canvas id="love-heart" role="img" aria-label="A heart gradually drawn from loving phrases in twenty languages"></canvas>
      </div>
      <footer class="footer">
        <p class="caption">A little love, written everywhere</p>
        <button class="replay" id="replay" type="button" aria-label="Replay the heart animation">
          <svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M13.35 6.2A5.55 5.55 0 1 0 13.3 9M13.35 2.8v3.8h-3.8" stroke="currentColor" stroke-width="1.15" stroke-linecap="round" stroke-linejoin="round"/></svg>
          Replay
        </button>
      </footer>
    </main>
    <script>
      (() => {
        const canvas = document.getElementById('love-heart');
        const ctx = canvas.getContext('2d');
        const replay = document.getElementById('replay');
        const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
        const phrases = [
          'I love you', 'ഞാൻ നിന്നെ സ്നേഹിക്കുന്നു', 'Te amo', "Je t'aime", 'Ich liebe dich',
          'Ti amo', 'Eu te amo', 'Я тебя люблю', '사랑해', '愛してる', '我爱你',
          'मैं तुमसे प्यार करता हूँ', "Σ' αγαπώ", 'Ik hou van jou',
          'Jag älskar dig', 'Kocham cię', 'Seni seviyorum', 'Anh yêu em',
          'Aku cinta kamu', 'ฉันรักคุณ'
        ];
        let points = [];
        let rows = [];
        let frame = 0;
        let startedAt = 0;
        let finishedAt = 0;
        let width = 0;
        let height = 0;
        let pixelRatio = 1;
        const duration = 10000;
        const curveSamples = 800;

        function heartPoint(angle) {
          return {
            x: 16 * Math.sin(angle) ** 3,
            y: 13 * Math.cos(angle) - 5 * Math.cos(2 * angle) - 2 * Math.cos(3 * angle) - Math.cos(4 * angle)
          };
        }

        function buildRows() {
          const polygon = [];
          for (let i = 0; i < curveSamples; i++) polygon.push(heartPoint(i / curveSamples * Math.PI * 2));
          const top = Math.min(...polygon.map(point => -point.y));
          const bottom = Math.max(...polygon.map(point => -point.y));
          const availableHeight = Math.min(height * .78, width * .84, 526);
          const scale = availableHeight / (bottom - top);
          const centerX = width / 2;
          const centerY = height / 2 + scale * (top + bottom) / 2;
          points = polygon.map(point => ({ x: centerX + point.x * scale, y: centerY - point.y * scale }));
          const fontSize = Math.max(9.1, Math.min(13.3, scale * .72));
          const lineHeight = fontSize * 1.48;
          ctx.font = `500 ${fontSize}px "Avenir Next", Avenir, "Segoe UI", sans-serif`;
          rows = [];
          let phraseIndex = 0;
          for (let y = centerY - scale * 17; y < centerY + scale * 17; y += lineHeight) {
            const intersections = [];
            for (let i = 0; i < points.length; i++) {
              const a = points[i];
              const b = points[(i + 1) % points.length];
              if ((a.y <= y && b.y > y) || (b.y <= y && a.y > y)) {
                intersections.push(a.x + (y - a.y) * (b.x - a.x) / (b.y - a.y));
              }
            }
            if (intersections.length < 2) continue;
            intersections.sort((a, b) => a - b);
            const left = intersections[0] + 2;
            const right = intersections[intersections.length - 1] - 2;
            if (right - left < fontSize * 2.4) continue;
            const items = [];
            let cursor = left;
            const gap = Math.max(7, fontSize * .9);
            while (cursor < right - fontSize * 1.7) {
              const phrase = phrases[phraseIndex++ % phrases.length];
              const phraseWidth = ctx.measureText(phrase).width;
              if (cursor + phraseWidth > right) {
                if (!items.length) items.push({ phrase, x: (left + right) / 2, centered: true, width: phraseWidth });
                break;
              }
              items.push({ phrase, x: cursor, centered: false, width: phraseWidth });
              cursor += phraseWidth + gap;
            }
            if (items.length) rows.push({ y, left, right, items });
          }
        }

        function draw(now) {
          ctx.clearRect(0, 0, width, height);
          const elapsed = now - startedAt;
          const progress = reducedMotion.matches ? 1 : Math.min(1, elapsed / duration);
          const totalItems = rows.reduce((count, row) => count + row.items.length, 0);
          let itemIndex = 0;
          const totalRows = rows.length;
          rows.forEach((row, rowIndex) => {
            row.items.forEach((item, itemInRow) => {
              const localOrder = (rowIndex / Math.max(1, totalRows - 1)) * .68 + (itemInRow / Math.max(1, row.items.length)) * .32;
              const delay = localOrder * 8200;
              const itemProgress = reducedMotion.matches ? 1 : Math.max(0, Math.min(1, (elapsed - delay) / 1050));
              const ease = 1 - Math.pow(1 - itemProgress, 3);
              const seed = Math.sin((rowIndex + 1) * 17.17 + (itemInRow + 2) * 9.31);
              const targetX = item.centered ? item.x : item.x + item.width / 2;
              const startX = targetX + seed * 32 * (1 - ease);
              const startY = row.y + (1 - ease) * (seed * 24 + 10);
              const shimmer = progress >= 1 && !reducedMotion.matches
                ? (Math.sin(now / 710 + rowIndex * .45 + itemInRow * .91) + 1) * .5
                : 0;
              const hue = 346 + ((rowIndex * 7 + itemInRow * 11) % 23);
              const lightness = 55 + ((rowIndex * 3 + itemInRow * 5) % 13) + shimmer * 8;
              ctx.globalAlpha = itemProgress === 0 ? 0 : .75 + shimmer * .25;
              ctx.fillStyle = `hsl(${hue} 66% ${lightness}%)`;
              ctx.shadowColor = `hsla(${hue} 82% 59% / ${shimmer * .18})`;
              ctx.shadowBlur = shimmer * 7;
              ctx.textAlign = item.centered ? 'center' : 'left';
              ctx.textBaseline = 'middle';
              ctx.fillText(item.phrase, startX, startY);
              itemIndex++;
            });
          });
          ctx.globalAlpha = 1;
          ctx.shadowBlur = 0;
          if (progress >= 1 && !finishedAt) finishedAt = now;
          if (!reducedMotion.matches || progress < 1) frame = requestAnimationFrame(draw);
        }

        function resize() {
          const rect = canvas.getBoundingClientRect();
          pixelRatio = Math.min(window.devicePixelRatio || 1, 2);
          width = Math.max(1, rect.width);
          height = Math.max(1, rect.height);
          canvas.width = Math.round(width * pixelRatio);
          canvas.height = Math.round(height * pixelRatio);
          ctx.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0);
          buildRows();
          replayAnimation();
        }

        function replayAnimation() {
          cancelAnimationFrame(frame);
          finishedAt = 0;
          startedAt = performance.now();
          frame = requestAnimationFrame(draw);
        }

        replay.addEventListener('click', replayAnimation);
        window.addEventListener('resize', resize, { passive: true });
        reducedMotion.addEventListener?.('change', replayAnimation);
        resize();
      })();
    </script>
  </body>
</html>
